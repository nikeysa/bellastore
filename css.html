<html>
<head>
  <title>Contoh Iframe</title>
  <style>
    body {
     font-family: Arial, sans-serif;
    }
    h2 {
      color: #2c3e50;
    }
    .container {
      border: 1px solid #aaa;
      padding: 10px;
      margin-top: 15px;
    }
    iframe {
       width: 100%;
       height: 400px;
       border: 1px solid #3498db;
    }
   </style>
  </head>
   <body>
     <h2>Contoh Penggunaan Iframe</h2>
     <div class="container">
        <p>Berikut adalah halaman web lain yang ditampilkan menggunakan iframe:</p>
        <iframe
          src="https://id.wikipedia.org/wiki/Anna_(Disney)"
          title="Wikipedia">
         </iframe>
       </div>
</body>
</html>
